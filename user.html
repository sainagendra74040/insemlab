
<!DOCTYPE html>
<html>
<head>

    <div class="product">

    </div>

    <div class="product">
        <h3>Smart Watch</h3>
        <p>Price: ₹1499</p>
        <button onclick="alert('Smart Watch added to cart!')">Add to Cart</button>
    </div>

    <div class="product">

        <p>Price: ₹1999</p>
        <button onclick="alert('Shoes added to cart!')">Add to Cart</button>
